workflows:
  nextjs_capacitor_android:
    name: Build Next.js + Capacitor Android APK
    environment:
      node: latest
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Next.js
        script: |
          npm run build

      - name: Prepare static output for Capacitor
        script: |
          # Next.js with 'output: export' already creates the out/ directory
          # No need to copy, the out/ directory is ready for Capacitor
          echo "Static output prepared: out/ directory ready"


      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
          cd ..

    artifacts:
      - android/app/build/outputs/**/*.apk

  nextjs_capacitor_ios:
    name: Build Next.js + Capacitor iOS
    environment:
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Next.js
        script: |
          npm run build

      - name: Prepare static output for Capacitor
        script: |
          echo "Static output prepared: out/ directory ready"

      - name: Add iOS platform if missing
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS app
        script: |
          if [ -z "${APPLE_DEVELOPMENT_TEAM_ID:-}" ]; then
            echo "APPLE_DEVELOPMENT_TEAM_ID is not set"
            exit 1
          fi

          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            archive

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${APPLE_DEVELOPMENT_TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - build/ipa/*.ipa
