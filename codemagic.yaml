workflows:
  nextjs_capacitor_android:
    name: Build Next.js + Capacitor Android APK
    environment:
      node: latest
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Next.js
        script: |
          npm run build
          npx next export

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
          cd ..

    artifacts:
      - android/app/build/outputs/**/*.apk
