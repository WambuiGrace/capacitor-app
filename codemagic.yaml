workflows:
  nextjs_capacitor_android:
    name: Build Next.js + Capacitor Android APK
    environment:
      node: latest
      java: 17

    scripts:
      # Install dependencies
      - name: Install dependencies
        script: |
          npm install -g pnpm
          pnpm install

      # Build Next.js
      - name: Build Next.js
        script: |
          pnpm run build
          pnpm next export

      # Sync Capacitor
      - name: Sync Capacitor
        script: |
          npx cap sync android

      # Build Android APK
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
          cd ..

    artifacts:
      - android/app/build/outputs/**/*.apk
