workflows:
  nextjs_capacitor_android:
    name: Build Next.js + Capacitor Android APK
    environment:
      node: latest
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Next.js
        script: |
          npm run build

      - name: Prepare static output for Capacitor
        script: |
          # Next.js with 'output: export' already creates the out/ directory
          # No need to copy, the out/ directory is ready for Capacitor
          echo "Static output prepared: out/ directory ready"


      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
          cd ..

    artifacts:
      - android/app/build/outputs/**/*.apk
